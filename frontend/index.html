    <!-- Rajdhani: the geometric gaming sans used for titles/headers on the
         Evo Chess and Home screens (scoped via .hero-chess-app/.home).
         Inter: the clean UI sans used for body text and badges there.
         Cinzel: a Roman-inspired display serif tried for the hub's
         side-panel chrome (button labels, panel titles).
         MedievalSharp: a decorative illuminated-manuscript display face -
         a visual match for frontend/public/hub/goodfonts.png (a font
         specimen image, not an actual font file) - being trialled on the
         same side-panel chrome as an alternative to Cinzel. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700;800&family=MedievalSharp&family=Rajdhani:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
